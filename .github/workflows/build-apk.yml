name: Android APK ve iOS Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Android APK Uret
    runs-on: ubuntu-latest

    steps:
      - name: Repo Kodlarini Cek
        uses: actions/checkout@v4

      - name: Node.js 22 Kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Java JDK 21 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bagimliliklari Kur ve Otomatik Ayarla
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npm run build
          
          # Build klasoru 'dist' mi yoksa 'build' mi otomatik tespit et
          if [ -d "dist" ]; then
            WEB_DIR="dist"
          elif [ -d "build" ]; then
            WEB_DIR="build"
          else
            mkdir -p www && echo "<html><body>Yukleniyor...</body></html>" > www/index.html
            WEB_DIR="www"
          fi
          
          # Eski bozuk config ve android klasorlerini tamamen temizle
          rm -rf android capacitor.config.ts capacitor.config.js capacitor.config.json
          
          # Siyah ekrani ve klasor hatasini cozen temiz config olustur
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.bizimmekanlar.app",
            "appName": "Bizim Mekanlar",
            "webDir": "$WEB_DIR",
            "server": {
              "url": "https://bizimmekanlar.com",
              "cleartext": true
            }
          }
          EOF
          
          # Android projesini sifirdan temiz kur ve esitle
          npx cap add android
          mkdir -p android/app/src/main/assets/public
          echo "[]" > android/app/src/main/assets/capacitor.plugins.json
          npx cap sync android

      - name: Gradle ile APK Derle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK Dosyasini Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: BizimMekanlar-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk